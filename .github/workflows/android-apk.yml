# Construit l'APK Android du jeu à chaque push, puis le publie dans une « Release » GitHub.
#
# Où le trouver : sur la page GitHub du dépôt, rubrique « Releases » (à droite),
# ou dans l'onglet « Actions » > le dernier build > « Artifacts ».
#
# Signature : par défaut, une clé de DÉBOGAGE est créée à chaque build. Android
# refuse alors de mettre à jour l'appli déjà installée : il faut la désinstaller
# avant d'installer la nouvelle version (la sauvegarde de la partie est perdue).
# Pour garder la même clé d'un build à l'autre, voir le README (« APK Android »).

name: APK Android

on:
  push:
    branches: ["**", "!captures"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write  # Nécessaire pour créer la Release.

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Godot et les modèles d'export
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates templates.tpz godot.zip

      - name: Indiquer à Godot où sont le SDK Android et Java
        run: |
          minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p "$HOME/.config/godot"
          for name in "editor_settings-${minor}.tres" "editor_settings-4.tres"; do
            cat > "$HOME/.config/godot/$name" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          done

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Clé fournie par le secret ANDROID_KEYSTORE_BASE64."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/game.keystore"
          else
            echo "Pas de secret : création d'une clé de débogage temporaire."
            keytool -genkeypair -keystore "$RUNNER_TEMP/game.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Importer le projet puis exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/game.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p build
          ./godot --headless --path . --import || true
          ./godot --headless --path . --export-debug "Android" build/SeigneurDesProfondeurs.apk
          ls -la build
          test -f build/SeigneurDesProfondeurs.apk

      # Des captures d'écran du jeu (menu, codex, partie), pour vérifier l'affichage.
      # Le rendu se fait sur un écran virtuel (Xvfb) avec OpenGL logiciel.
      - name: Captures d'écran
        continue-on-error: true
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/build/screens
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 600 ./godot --path . \
            --rendering-driver opengl3 --resolution 1280x720 -s res://tools/screenshots.gd 2>&1 | tee screenshots.log
          echo "----- Étapes -----"
          grep -E "ÉTAPE|CAPTURE" screenshots.log || true
          echo "----- Premières erreurs (avec contexte) -----"
          grep -n -m 15 -A 3 -E "SCRIPT ERROR|Parse Error" screenshots.log || echo "Aucune erreur de script."
          echo "----- Résumé des erreurs (nombre d'apparitions) -----"
          grep -A 1 -E "SCRIPT ERROR" screenshots.log | grep -v "^--" | paste - - | sort | uniq -c | sort -rn | head -20 || true

      - name: Garder les captures d'écran
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecran
          path: build/screens
          if-no-files-found: warn

      # Les captures sont aussi poussées sur la branche « captures » du dépôt
      # (pratique pour les regarder sans télécharger d'archive).
      - name: Publier les captures sur la branche « captures »
        continue-on-error: true
        run: |
          if ls build/screens/*.png > /dev/null 2>&1; then
            cd build/screens
            git init -q -b captures
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add ./*.png
            git commit -q -m "Captures du build ${{ github.run_number }} (${{ github.sha }})"
            git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" captures
          fi

      - name: Garder l'APK dans les « Artifacts » du build
        uses: actions/upload-artifact@v4
        with:
          name: SeigneurDesProfondeurs-apk
          path: build/SeigneurDesProfondeurs.apk

      - name: Publier l'APK dans une Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Seigneur des Profondeurs - build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK Android construit automatiquement depuis la branche `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Pour l'installer : télécharge le fichier .apk depuis ton téléphone et ouvre-le
            (autorise l'installation d'applications de sources inconnues si Android le demande).
            Si une version précédente est installée, désinstalle-la d'abord (clé de débogage différente).
          files: build/SeigneurDesProfondeurs.apk
          make_latest: true
